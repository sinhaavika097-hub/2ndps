<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriTech IoT Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712; /* Tailwind gray-950 */
        }
        /* Custom scrollbar for a polished look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #111827; 
        }
        ::-webkit-scrollbar-thumb {
            background: #374151; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563; 
        }
        .pulse-dot {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col">

    <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="bg-emerald-500/20 p-2 rounded-lg text-emerald-400">
                        <i class="fa-solid fa-leaf text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold tracking-tight text-white">AgriTech AI Core</h1>
                        <p class="text-xs text-gray-400">Precision Farming Dashboard</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="hidden sm:flex items-center gap-2 text-sm text-gray-400 bg-gray-800 px-3 py-1.5 rounded-full border border-gray-700">
                        <div class="w-2 h-2 rounded-full bg-emerald-500 pulse-dot"></div>
                        System Live
                    </div>
                    <div class="text-sm text-gray-400" id="last-updated">
                        Updated: Just now
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto w-full">
        <div class="mb-6 flex justify-between items-end">
            <div>
                <h2 class="text-2xl font-semibold text-white">Field Sensor Network</h2>
                <p class="text-gray-400 text-sm mt-1">Real-time telemetry and AI analytics from deployed edge devices.</p>
            </div>
            <button onclick="forceRefresh()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-4 py-2 rounded-lg text-sm transition-colors border border-gray-700 flex items-center gap-2">
                <i class="fa-solid fa-rotate-right" id="refresh-icon"></i>
                <span class="hidden sm:inline">Refresh</span>
            </button>
        </div>

        <!-- Dashboard Grid Container -->
        <div id="nodes-container" class="grid grid-cols-1 xl:grid-cols-2 gap-6">
            <!-- Node cards will be injected here by JavaScript -->
        </div>
    </main>

    <script>
        // Initial state simulating the C++ backend response
        let nodesData = [
            {
                id: "ESP32_NODE_A1",
                location: "North Sector (Wheat)",
                temperature_c: 24.5,
                humidity_percent: 55.0,
                soil_moisture: 50.0,
                ndvi_score: 0.75,
                pest_risk: "SAFE",
                yield_health: 85.5
            },
            {
                id: "ESP32_NODE_B2",
                location: "East Sector (Corn)",
                temperature_c: 32.0,
                humidity_percent: 75.0,
                soil_moisture: 30.0,
                ndvi_score: 0.35,
                pest_risk: "CRITICAL",
                yield_health: 42.0
            }
        ];

        // Formatters
        const formatDec = (num, decimals = 1) => Number(num).toFixed(decimals);

        // Helper for styling risk status
        function getRiskConfig(status) {
            switch(status) {
                case "CRITICAL":
                    return { color: "text-red-400", bg: "bg-red-500/10", border: "border-red-500/20", icon: "fa-triangle-exclamation", text: "CRITICAL: High Pest Probability" };
                case "WARNING":
                    return { color: "text-yellow-400", bg: "bg-yellow-500/10", border: "border-yellow-500/20", icon: "fa-circle-exclamation", text: "WARNING: Moderate Stress Detected" };
                case "SAFE":
                default:
                    return { color: "text-emerald-400", bg: "bg-emerald-500/10", border: "border-emerald-500/20", icon: "fa-shield-check", text: "SAFE: Nominal Conditions" };
            }
        }

        // Helper for health progress bar color
        function getHealthColorClass(health) {
            if (health >= 75) return "bg-emerald-500";
            if (health >= 50) return "bg-yellow-500";
            return "bg-red-500";
        }

        function renderDashboard() {
            const container = document.getElementById('nodes-container');
            container.innerHTML = ''; // Clear existing

            nodesData.forEach(node => {
                const riskConfig = getRiskConfig(node.pest_risk);
                const healthColor = getHealthColorClass(node.yield_health);

                const cardHTML = `
                    <div class="bg-gray-900 rounded-2xl border border-gray-800 p-5 shadow-lg flex flex-col gap-6 transform transition duration-300 hover:border-gray-700">
                        
                        <!-- Node Header -->
                        <div class="flex justify-between items-start border-b border-gray-800 pb-4">
                            <div>
                                <div class="flex items-center gap-2">
                                    <h3 class="text-lg font-semibold text-white tracking-wide">${node.id}</h3>
                                    <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-gray-800 text-gray-400 border border-gray-700">Online</span>
                                </div>
                                <p class="text-sm text-gray-400 mt-1"><i class="fa-solid fa-location-dot mr-1"></i> ${node.location}</p>
                            </div>
                            <div class="text-right">
                                <div class="text-3xl font-bold ${riskConfig.color} flex items-center justify-end gap-2">
                                    <i class="fa-solid ${riskConfig.icon} text-2xl"></i>
                                </div>
                                <p class="text-xs text-gray-500 mt-1 font-medium uppercase tracking-wider">Status</p>
                            </div>
                        </div>

                        <!-- Metrics Grid -->
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                            <!-- Temp -->
                            <div class="bg-gray-950/50 rounded-xl p-4 border border-gray-800/50">
                                <div class="flex items-center gap-2 text-gray-400 mb-2">
                                    <i class="fa-solid fa-temperature-half text-orange-400"></i>
                                    <span class="text-xs font-medium uppercase tracking-wider">Temp</span>
                                </div>
                                <div class="text-2xl font-semibold text-white">${formatDec(node.temperature_c)}<span class="text-sm text-gray-500 font-normal">°C</span></div>
                            </div>
                            
                            <!-- Humidity -->
                            <div class="bg-gray-950/50 rounded-xl p-4 border border-gray-800/50">
                                <div class="flex items-center gap-2 text-gray-400 mb-2">
                                    <i class="fa-solid fa-droplet text-blue-400"></i>
                                    <span class="text-xs font-medium uppercase tracking-wider">Humidity</span>
                                </div>
                                <div class="text-2xl font-semibold text-white">${formatDec(node.humidity_percent)}<span class="text-sm text-gray-500 font-normal">%</span></div>
                            </div>

                            <!-- Soil Moisture -->
                            <div class="bg-gray-950/50 rounded-xl p-4 border border-gray-800/50">
                                <div class="flex items-center gap-2 text-gray-400 mb-2">
                                    <i class="fa-solid fa-water text-cyan-400"></i>
                                    <span class="text-xs font-medium uppercase tracking-wider">Soil Moist</span>
                                </div>
                                <div class="text-2xl font-semibold text-white">${formatDec(node.soil_moisture)}<span class="text-sm text-gray-500 font-normal">%</span></div>
                            </div>

                            <!-- NDVI -->
                            <div class="bg-gray-950/50 rounded-xl p-4 border border-gray-800/50">
                                <div class="flex items-center gap-2 text-gray-400 mb-2">
                                    <i class="fa-solid fa-satellite text-purple-400"></i>
                                    <span class="text-xs font-medium uppercase tracking-wider">NDVI</span>
                                </div>
                                <div class="text-2xl font-semibold text-white">${formatDec(node.ndvi_score, 2)}</div>
                            </div>
                        </div>

                        <!-- AI Analytics Section -->
                        <div class="mt-auto space-y-4 pt-2">
                            <!-- Pest Risk Alert Box -->
                            <div class="${riskConfig.bg} ${riskConfig.border} border rounded-xl p-3 flex items-start gap-3">
                                <div class="${riskConfig.color} mt-0.5">
                                    <i class="fa-solid fa-microchip"></i>
                                </div>
                                <div>
                                    <h4 class="text-sm font-semibold ${riskConfig.color}">AI Pest Analysis</h4>
                                    <p class="text-xs ${riskConfig.color} opacity-80 mt-0.5">${riskConfig.text}</p>
                                </div>
                            </div>

                            <!-- Yield Health Progress -->
                            <div>
                                <div class="flex justify-between items-end mb-2">
                                    <span class="text-sm font-medium text-gray-300">Estimated Yield Health</span>
                                    <span class="text-sm font-bold text-white">${formatDec(node.yield_health)}%</span>
                                </div>
                                <div class="w-full bg-gray-800 rounded-full h-2.5 border border-gray-700 overflow-hidden">
                                    <div class="${healthColor} h-2.5 rounded-full transition-all duration-1000 ease-in-out" style="width: ${node.yield_health}%"></div>
                                </div>
                            </div>
                        </div>

                    </div>
                `;
                container.innerHTML += cardHTML;
            });
            
            updateTimestamp();
        }

        function updateTimestamp() {
            const now = new Date();
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('last-updated').textContent = `Updated: ${timeString}`;
        }

        // Mock API Fetch - Simulates polling the C++ backend
        async function fetchMockData() {
            // In a real app, this would be: await fetch('api/agritech/nodes')
            
            // Simulating network delay and data fluctuation
            return new Promise(resolve => {
                setTimeout(() => {
                    // Fluctuate data slightly to simulate live sensors
                    nodesData = nodesData.map(node => {
                        // Random walk for values
                        let newTemp = node.temperature_c + (Math.random() - 0.5) * 0.5;
                        let newHum = node.humidity_percent + (Math.random() - 0.5) * 1.5;
                        let newSoil = node.soil_moisture + (Math.random() - 0.5) * 1.0;
                        
                        // Recalculate AI logics loosely based on C++ logic
                        let pestRisk = "SAFE";
                        let riskScore = 0;
                        if (newTemp > 28 && newTemp < 35) riskScore += 0.3;
                        if (newHum > 70) riskScore += 0.25;
                        if (node.ndvi_score < 0.4) riskScore += 0.45;

                        if (riskScore >= 0.75) pestRisk = "CRITICAL";
                        else if (riskScore >= 0.4) pestRisk = "WARNING";

                        // Recalculate yield health based on moisture
                        let moistFactor = (newSoil > 40 && newSoil < 60) ? 1.0 : 0.6;
                        let ndviFactor = node.ndvi_score * 1.5;
                        let newYield = Math.min((moistFactor * 0.4) + (ndviFactor * 0.6), 1.0) * 100;

                        return {
                            ...node,
                            temperature_c: newTemp,
                            humidity_percent: newHum,
                            soil_moisture: Math.max(0, newSoil), // prevent negatives
                            pest_risk: pestRisk,
                            yield_health: newYield
                        };
                    });
                    
                    resolve(nodesData);
                }, 500); // 500ms mock network latency
            });
        }

        // Main update loop
        async function pollData() {
            const icon = document.getElementById('refresh-icon');
            icon.classList.add('fa-spin');
            
            await fetchMockData();
            renderDashboard();
            
            setTimeout(() => {
                icon.classList.remove('fa-spin');
            }, 500);
        }

        function forceRefresh() {
            pollData();
        }

        // Initialize dashboard on load
        window.onload = () => {
            renderDashboard();
            // Poll for new data every 4 seconds
            setInterval(pollData, 4000);
        };
    </script>
</body>
</html>
